name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      NOT_CRAN: "true"
      HSMS_PROJECTS_DIR: ${{ github.workspace }}/../hsms-projects
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
      - name: Cache renv library
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R/renv
            ~/AppData/Local/R/cache/R/renv
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
      - name: Restore pinned dependencies
        run: Rscript scripts/bootstrap.R
        env:
          HSMS_CRAN_REPO: ${{ runner.os == 'Linux' && 'https://packagemanager.posit.co/cran/__linux__/noble/latest' || 'https://cloud.r-project.org' }}
      - name: Unit and integration tests
        run: Rscript scripts/test.R
      - name: Demo smoke test
        run: Rscript scripts/smoke_demo.R
      - name: Browser end-to-end test (Linux)
        if: runner.os == 'Linux'
        run: |
          CHROME=$(which google-chrome || which chromium-browser || true)
          if [ -z "$CHROME" ]; then echo "::error::No Chrome/Chromium found; browser test NOT run"; exit 1; fi
          CHROMOTE_CHROME="$CHROME" Rscript scripts/test.R --browser
